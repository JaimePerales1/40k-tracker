<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Warhammer 40,000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (compat build — no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --void: #121014;
    --panel: #1b181e;
    --panel-edge: #2a2530;
    --steel: #8d8593;
    --bone: #e8e2d6;
    --gold: #c9a227;
    --gold-dim: #7a6420;
    --azure: #4f8fb8;
    --azure-dim: #2e5570;
    --blood: #a4353c;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,162,39,0.07), transparent);
    color: var(--bone);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 18px 12px 40px;
  }

  .app { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 16px; }

  .nav-links { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  .nav-link {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--steel);
    text-decoration: none;
    border: 1px solid var(--panel-edge);
    padding: 6px 12px;
    border-radius: 20px;
    transition: color .15s, border-color .15s;
  }
  .nav-link:hover { color: var(--gold); border-color: var(--gold-dim); }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 5px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-transform: uppercase;
  }

  h1::after {
    content: "";
    display: block;
    width: 120px;
    height: 1px;
    margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .section-heading {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--azure);
    margin: 26px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .section-heading:first-of-type { margin-top: 0; }

  /* ---------- Status banner ---------- */
  .status-banner {
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--steel);
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .status-banner.error { border-color: var(--blood); color: var(--bone); }
  .status-banner.show { display: block; }

  /* ---------- Standings ---------- */
  .standings-table {
    width: 100%;
    border-collapse: collapse;
  }
  .standings-table th {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--steel);
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .standings-table th.num, .standings-table td.num { text-align: center; }
  .standings-table td {
    font-size: 15px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .standings-table tr:last-child td { border-bottom: none; }
  .rank-cell { color: var(--gold); font-family: 'Cinzel', serif; font-weight: 700; width: 26px; }
  .name-cell { font-weight: 600; }
  .empty-note { color: var(--steel); font-size: 14px; text-align: center; padding: 20px 0; }

  .season-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    align-items: center;
  }

  #seasonFilter {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: var(--bone);
  }
  #seasonFilter:focus { outline: none; border-color: var(--gold-dim); }

  .season-btn {
    flex-shrink: 0;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  .season-btn:hover { background: rgba(201,162,39,0.1); }

  /* ---------- Log match form ---------- */
  .log-form {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: 16px;
  }

  .side-by-side {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .side-col {
    border-top: 3px solid var(--gold);
    border-radius: 6px;
    background: #221e27;
    padding: 10px;
  }
  .side-col.loser-col { border-top-color: var(--azure); }

  .side-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .loser-col .side-label { color: var(--azure); }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--steel);
    margin: 8px 0 4px;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 8px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    background: var(--void);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: var(--bone);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gold-dim); }
  textarea { resize: vertical; min-height: 50px; }

  .shared-fields { margin-bottom: 14px; }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, #e0bb45, var(--gold));
    color: var(--void);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .15s;
  }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Match history ---------- */
  .match-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .match-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .match-date {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #5a5560;
  }

  .match-season-tag {
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--steel);
    background: #221e27;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .match-result {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .match-side { flex: 1; min-width: 0; }

  .match-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--gold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .match-side.loser .match-name { color: var(--azure); }

  .match-score {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 20px;
  }

  .match-army {
    font-size: 11px;
    color: var(--steel);
  }

  .match-sep {
    font-size: 11px;
    color: #5a5560;
    letter-spacing: 0.1em;
  }

  .match-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--steel);
    line-height: 1.4;
    border-top: 1px solid var(--panel-edge);
    padding-top: 8px;
  }

  .load-more-btn {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: transparent;
    color: var(--steel);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .load-more-btn:hover { color: var(--gold); border-color: var(--gold-dim); }

  footer {
    text-align: center;
    margin-top: 26px;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #4a444f;
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (max-width: 340px) {
    .side-by-side { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="nav-links">
      <a class="nav-link" href="index.html">◂ Tracker</a>
      <a class="nav-link" href="codex.html">Codex</a>
    </div>
    <div class="eyebrow">Glory to the victors</div>
    <h1>Leaderboard</h1>
  </header>

  <div class="status-banner" id="statusBanner"></div>

  <div class="section-heading">Standings</div>
  <div class="season-bar">
    <select id="seasonFilter" aria-label="Season filter"></select>
    <button type="button" id="newSeasonBtn" class="season-btn">+ New Season</button>
  </div>
  <table class="standings-table" id="standingsTable" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Commander</th>
        <th class="num">W</th>
        <th class="num">L</th>
        <th class="num">Played</th>
      </tr>
    </thead>
    <tbody id="standingsBody"></tbody>
  </table>
  <div class="empty-note" id="standingsEmpty">No matches logged yet — be the first to claim glory.</div>

  <div class="section-heading">Log a Match</div>
  <form class="log-form" id="matchForm">
    <div class="side-by-side">
      <div class="side-col winner-col">
        <div class="side-label">🏆 Winner</div>
        <label for="winnerName">Name</label>
        <input type="text" id="winnerName" required autocomplete="off">
        <label for="winnerScore">Final Score</label>
        <input type="number" id="winnerScore" min="0" required>
        <label for="winnerArmy">Army / Faction</label>
        <input type="text" id="winnerArmy" autocomplete="off" placeholder="Optional">
      </div>

      <div class="side-col loser-col">
        <div class="side-label">Opponent</div>
        <label for="loserName">Name</label>
        <input type="text" id="loserName" required autocomplete="off">
        <label for="loserScore">Final Score</label>
        <input type="number" id="loserScore" min="0" required>
        <label for="loserArmy">Army / Faction</label>
        <input type="text" id="loserArmy" autocomplete="off" placeholder="Optional">
      </div>
    </div>

    <div class="shared-fields">
      <label for="mission">Mission Played</label>
      <input type="text" id="mission" autocomplete="off" placeholder="Optional">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Optional — anything worth remembering about this game"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Log Match</button>
  </form>

  <div class="section-heading">Match History</div>
  <div id="historyContainer"></div>
  <div class="empty-note" id="historyEmpty">No matches yet.</div>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Load older matches</button>

  <footer>The Emperor Protects</footer>
</div>

<script>
  // ======================================================
  // PASTE YOUR FIREBASE CONFIG BELOW — replace the object
  // entirely with the one from your Firebase project settings.
  // ======================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDwIdVFVKY68xTqlAzXYC6b09c_xNgRnVI",
    authDomain: "k-tracker-b5034.firebaseapp.com",
    projectId: "k-tracker-b5034",
    storageBucket: "k-tracker-b5034.firebasestorage.app",
    messagingSenderId: "111213205099",
    appId: "1:111213205099:web:0df81ffd422a1402b3c32e"
  };
  // ======================================================

  let db, firebaseReady = false;

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  } catch (e) {
    showStatus('Leaderboard isn\'t connected yet — the app owner needs to add their Firebase config.', true);
  }

  const PAGE_SIZE = 15;
  let allMatches = [];            // full match cache, sorted newest-first
  let currentSeasonName = 'Season 1';
  let activeFilter = 'current';   // 'current' | 'all' | <specific season name>
  let historyRenderedCount = 0;

  function tsToMillis(ts) {
    if (!ts) return 0;
    if (typeof ts.toMillis === 'function') return ts.toMillis();
    if (typeof ts.toDate === 'function') return ts.toDate().getTime();
    return 0;
  }

  function getMatchSeason(m) {
    return m.season || 'Season 1'; // matches logged before seasons existed default here
  }

  function showStatus(msg, isError) {
    const el = document.getElementById('statusBanner');
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
  }

  function hideStatus() {
    document.getElementById('statusBanner').classList.remove('show');
  }

  // ---------- Submit a match ----------
  document.getElementById('matchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!firebaseReady) { showStatus('Leaderboard isn\'t connected yet.', true); return; }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging…';
    hideStatus();

    try {
      const winnerName = document.getElementById('winnerName').value.trim();
      const loserName = document.getElementById('loserName').value.trim();
      const winnerScore = Number(document.getElementById('winnerScore').value) || 0;
      const loserScore = Number(document.getElementById('loserScore').value) || 0;
      const winnerArmy = document.getElementById('winnerArmy').value.trim();
      const loserArmy = document.getElementById('loserArmy').value.trim();
      const mission = document.getElementById('mission').value.trim();
      const notes = document.getElementById('notes').value.trim();

      const matchRef = db.collection('matches').doc();

      await matchRef.set({
        winnerName, loserName, winnerScore, loserScore,
        winnerArmy, loserArmy, mission, notes,
        season: currentSeasonName,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('matchForm').reset();
      showStatus('Match logged!', false);
      setTimeout(hideStatus, 2500);

      await fetchAllMatches();
      buildSeasonOptions();
      renderStandings();
      resetHistoryView();

    } catch (err) {
      console.error(err);
      showStatus('Could not log this match — check your connection, or the leaderboard may not be set up yet.', true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log Match';
    }
  });

  // ---------- Data loading ----------
  function loadMeta() {
    return db.collection('meta').doc('config').get().then((doc) => {
      currentSeasonName = (doc.exists && doc.data().currentSeason) ? doc.data().currentSeason : 'Season 1';
    }).catch(() => { currentSeasonName = 'Season 1'; });
  }

  function fetchAllMatches() {
    return db.collection('matches').get().then((snapshot) => {
      const arr = [];
      snapshot.forEach((doc) => arr.push({ id: doc.id, ...doc.data() }));
      arr.sort((a, b) => tsToMillis(b.timestamp) - tsToMillis(a.timestamp));
      allMatches = arr;
      return arr;
    }).catch((err) => {
      console.error(err);
      showStatus('Could not load the leaderboard — check your connection, or it may not be set up yet.', true);
      return [];
    });
  }

  function filteredMatches() {
    if (activeFilter === 'all') return allMatches;
    const seasonToMatch = activeFilter === 'current' ? currentSeasonName : activeFilter;
    return allMatches.filter((m) => getMatchSeason(m) === seasonToMatch);
  }

  // ---------- Season dropdown ----------
  function buildSeasonOptions() {
    const seasonLatest = {};
    allMatches.forEach((m) => {
      const s = getMatchSeason(m);
      const t = tsToMillis(m.timestamp);
      if (!(s in seasonLatest) || t > seasonLatest[s]) seasonLatest[s] = t;
    });

    const historicalSeasons = Object.keys(seasonLatest)
      .filter((s) => s !== currentSeasonName)
      .sort((a, b) => seasonLatest[b] - seasonLatest[a]);

    const select = document.getElementById('seasonFilter');
    select.innerHTML = '';
    addSeasonOption(select, 'current', `Current — ${currentSeasonName}`);
    addSeasonOption(select, 'all', 'All-Time');
    historicalSeasons.forEach((s) => addSeasonOption(select, s, s));
    select.value = activeFilter;
  }

  function addSeasonOption(select, value, label) {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label;
    select.appendChild(opt);
  }

  document.getElementById('seasonFilter').addEventListener('change', (e) => {
    activeFilter = e.target.value;
    renderStandings();
    resetHistoryView();
  });

  function suggestNextSeasonName() {
    const seen = new Set(allMatches.map(getMatchSeason));
    seen.add(currentSeasonName);
    let maxNum = 0;
    seen.forEach((s) => {
      const match = /^Season (\d+)$/.exec(s);
      if (match) maxNum = Math.max(maxNum, parseInt(match[1], 10));
    });
    return `Season ${maxNum + 1}`;
  }

  document.getElementById('newSeasonBtn').addEventListener('click', async () => {
    if (!firebaseReady) { showStatus('Leaderboard isn\'t connected yet.', true); return; }
    const suggestion = suggestNextSeasonName();
    const name = window.prompt('Name this new season:', suggestion);
    if (!name || !name.trim()) return;
    const trimmed = name.trim();

    try {
      await db.collection('meta').doc('config').set({ currentSeason: trimmed }, { merge: true });
      currentSeasonName = trimmed;
      activeFilter = 'current';
      buildSeasonOptions();
      renderStandings();
      resetHistoryView();
      showStatus(`${trimmed} has begun! Past seasons are safe and still viewable in the dropdown.`, false);
      setTimeout(hideStatus, 4000);
    } catch (err) {
      console.error(err);
      showStatus('Could not start a new season — check your connection.', true);
    }
  });

  // ---------- Standings ----------
  function renderStandings() {
    const matches = filteredMatches();
    const stats = {};
    matches.forEach((d) => {
      const w = (d.winnerName || '').trim();
      const l = (d.loserName || '').trim();
      if (w) {
        const key = w.toLowerCase();
        if (!stats[key]) stats[key] = { name: w, wins: 0, losses: 0 };
        stats[key].wins++;
      }
      if (l) {
        const key = l.toLowerCase();
        if (!stats[key]) stats[key] = { name: l, wins: 0, losses: 0 };
        stats[key].losses++;
      }
    });

    const rows = Object.values(stats).sort((a, b) => b.wins - a.wins || (b.wins + b.losses) - (a.wins + a.losses));
    const tbody = document.getElementById('standingsBody');
    const table = document.getElementById('standingsTable');
    const empty = document.getElementById('standingsEmpty');

    if (rows.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td class="rank-cell">${i + 1}</td>
        <td class="name-cell">${escapeHtml(r.name)}</td>
        <td class="num">${r.wins}</td>
        <td class="num">${r.losses}</td>
        <td class="num">${r.wins + r.losses}</td>
      </tr>
    `).join('');
  }

  // ---------- Match history (in-memory pagination — no index setup needed) ----------
  function resetHistoryView() {
    historyRenderedCount = 0;
    document.getElementById('historyContainer').innerHTML = '';
    renderNextHistoryPage();
  }

  function renderNextHistoryPage() {
    const matches = filteredMatches();
    const empty = document.getElementById('historyEmpty');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    if (matches.length === 0) {
      empty.style.display = 'block';
      loadMoreBtn.style.display = 'none';
      return;
    }
    empty.style.display = 'none';

    const nextSlice = matches.slice(historyRenderedCount, historyRenderedCount + PAGE_SIZE);
    const container = document.getElementById('historyContainer');
    nextSlice.forEach((d) => container.insertAdjacentHTML('beforeend', renderMatchCard(d)));
    historyRenderedCount += nextSlice.length;
    loadMoreBtn.style.display = historyRenderedCount < matches.length ? 'block' : 'none';
  }

  document.getElementById('loadMoreBtn').addEventListener('click', renderNextHistoryPage);

  function renderMatchCard(d) {
    const date = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const metaParts = [];
    if (d.mission) metaParts.push(`<strong>Mission:</strong> ${escapeHtml(d.mission)}`);
    if (d.notes) metaParts.push(escapeHtml(d.notes));
    const meta = metaParts.length ? `<div class="match-meta">${metaParts.join(' — ')}</div>` : '';

    return `
      <div class="match-card">
        <div class="match-top-row">
          <span class="match-date">${date}</span>
          <span class="match-season-tag">${escapeHtml(getMatchSeason(d))}</span>
        </div>
        <div class="match-result">
          <div class="match-side winner">
            <div class="match-name">${escapeHtml(d.winnerName || 'Unknown')}</div>
            ${d.winnerArmy ? `<div class="match-army">${escapeHtml(d.winnerArmy)}</div>` : ''}
          </div>
          <div class="match-score" style="color:var(--gold)">${d.winnerScore ?? '–'}</div>
          <div class="match-sep">VS</div>
          <div class="match-score" style="color:var(--azure)">${d.loserScore ?? '–'}</div>
          <div class="match-side loser">
            <div class="match-name">${escapeHtml(d.loserName || 'Unknown')}</div>
            ${d.loserArmy ? `<div class="match-army">${escapeHtml(d.loserArmy)}</div>` : ''}
          </div>
        </div>
        ${meta}
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // ---------- Init ----------
  async function initApp() {
    if (!firebaseReady) {
      document.getElementById('standingsEmpty').textContent = 'Leaderboard not connected yet.';
      document.getElementById('historyEmpty').textContent = 'Leaderboard not connected yet.';
      return;
    }
    await loadMeta();
    await fetchAllMatches();
    buildSeasonOptions();
    renderStandings();
    resetHistoryView();
  }
  initApp();
</script>
</body>
</html>
