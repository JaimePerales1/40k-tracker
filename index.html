<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Tracker — Warhammer 40,000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #121014;
    --panel: #1b181e;
    --panel-edge: #2a2530;
    --steel: #8d8593;
    --bone: #e8e2d6;
    --gold: #c9a227;
    --gold-dim: #7a6420;
    --azure: #4f8fb8;
    --azure-dim: #2e5570;
    --blood: #a4353c;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,162,39,0.07), transparent);
    color: var(--bone);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 18px 10px 40px;
  }

  .app { width: 100%; max-width: 520px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 18px; }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 5px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-transform: uppercase;
  }

  h1::after {
    content: "";
    display: block;
    width: 120px;
    height: 1px;
    margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  /* ---------- Round rail ---------- */
  .round-section { margin-bottom: 16px; }

  .round-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 8px;
  }

  .round-rail {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .round-plate {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 18px;
    text-align: center;
    padding: 10px 0 8px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: #4a444f;
    transition: color .25s, border-color .25s, background .25s;
  }

  .round-plate.done { color: var(--gold-dim); border-color: var(--gold-dim); }

  .round-plate.active {
    color: var(--void);
    background: linear-gradient(180deg, #e0bb45, var(--gold));
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(201,162,39,0.35);
  }

  .round-controls { display: flex; gap: 8px; margin-top: 8px; }

  .round-btn {
    flex: 1;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: background .15s;
  }

  .round-btn.secondary-btn {
    flex: 0 0 auto;
    padding: 10px 14px;
    border-color: var(--panel-edge);
    color: var(--steel);
  }

  .round-btn:hover { background: rgba(201,162,39,0.1); }
  .round-btn:active { transform: translateY(1px); }
  .round-btn:disabled { opacity: .35; cursor: default; }

  .game-over {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--blood);
    margin-top: 8px;
    text-transform: uppercase;
    display: none;
  }

  /* ---------- Head-to-head score bar ---------- */
  .versus-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 14px;
    gap: 8px;
  }

  .versus-side { text-align: center; }

  .versus-side .vname {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
    margin-left: auto;
    margin-right: auto;
  }

  .versus-side .vscore {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1;
    color: var(--bone);
    transition: color .2s;
  }

  .versus-side.leading .vscore.p1 { color: var(--gold); }
  .versus-side.leading .vscore.p2 { color: var(--azure); }

  .versus-vs {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: #4a444f;
    letter-spacing: 0.1em;
  }

  /* ---------- Player columns ---------- */
  .players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .player {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-top: 3px solid var(--gold);
    border-radius: var(--radius);
    padding: 12px 10px;
  }

  .player.p2 { border-top-color: var(--azure); }

  .player-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    color: var(--gold);
    margin-bottom: 10px;
    padding: 4px 6px;
    border-radius: 4px;
    outline: none;
    min-height: 1.4em;
    cursor: text;
  }

  .player.p2 .player-name { color: var(--azure); }

  .player-name:focus {
    background: #221e27;
    box-shadow: 0 0 0 1px var(--panel-edge);
  }

  .stat { margin-bottom: 12px; }
  .stat:last-child { margin-bottom: 0; }

  .stat-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 5px;
  }

  .counter-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .count {
    flex: 1;
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
    min-width: 40px;
  }

  .btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--panel-edge);
    background: #221e27;
    color: var(--bone);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 20px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    user-select: none;
    touch-action: manipulation;
  }

  .btn:hover { border-color: var(--gold-dim); background: #2a2530; }
  .btn:active { transform: translateY(1px); }
  .btn.minus { color: var(--blood); }
  .btn.plus  { color: var(--gold); }
  .player.p2 .btn.plus { color: var(--azure); }
  .player.p2 .btn:hover { border-color: var(--azure-dim); }

  .quick-row { display: flex; gap: 5px; margin-top: 6px; }

  .quick {
    flex: 1;
    padding: 7px 0;
    border-radius: 5px;
    border: 1px solid var(--panel-edge);
    background: transparent;
    color: var(--steel);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
    touch-action: manipulation;
  }

  .quick:hover { color: var(--gold); border-color: var(--gold-dim); }
  .player.p2 .quick:hover { color: var(--azure); border-color: var(--azure-dim); }
  .quick:active { transform: translateY(1px); }

  /* ---------- Footer ---------- */
  .reset-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--blood);
    background: transparent;
    color: var(--blood);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s;
  }

  .reset-btn:hover { background: rgba(164,53,60,0.1); }

  .confirm-row { display: none; gap: 8px; margin-top: 14px; }

  .confirm-row button {
    flex: 1;
    padding: 12px;
    border-radius: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--steel);
  }

  .confirm-row .confirm-yes {
    border-color: var(--blood);
    color: var(--bone);
    background: var(--blood);
  }

  footer {
    text-align: center;
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #4a444f;
  }

  button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* Very narrow screens: stack the players */
  @media (max-width: 350px) {
    .players { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">In the grim darkness of the far future</div>
    <h1>Battle Tracker</h1>
  </header>

  <!-- Round -->
  <section class="round-section">
    <div class="round-label">
      <span>Battle Round</span>
      <span id="roundText">Round 1 of 5</span>
    </div>
    <div class="round-rail" id="roundRail">
      <div class="round-plate active">I</div>
      <div class="round-plate">II</div>
      <div class="round-plate">III</div>
      <div class="round-plate">IV</div>
      <div class="round-plate">V</div>
    </div>
    <div class="round-controls">
      <button class="round-btn secondary-btn" id="prevRound" onclick="changeRound(-1)" disabled>◂ Back</button>
      <button class="round-btn" id="nextRound" onclick="changeRound(1)">Next Round ▸</button>
    </div>
    <div class="game-over" id="gameOver">☠ Battle Complete ☠</div>
  </section>

  <!-- Head to head -->
  <div class="versus-bar">
    <div class="versus-side" id="vSide1">
      <div class="vname" id="vName1">Player 1</div>
      <div class="vscore p1" id="vScore1">0</div>
    </div>
    <div class="versus-vs">VS</div>
    <div class="versus-side" id="vSide2">
      <div class="vname" id="vName2">Player 2</div>
      <div class="vscore p2" id="vScore2">0</div>
    </div>
  </div>

  <!-- Players -->
  <div class="players">

    <!-- Player 1 -->
    <section class="player p1">
      <div class="player-name" id="name1" contenteditable="true" spellcheck="false" oninput="syncNames()" title="Tap to rename">Player 1</div>

      <div class="stat">
        <div class="stat-label"><span>Primary</span><span>max 50</span></div>
        <div class="counter-row">
          <button class="btn minus" onclick="adjust(1,'primary',-1)" aria-label="Player 1 primary minus 1">−</button>
          <div class="count" id="p1primary">0</div>
          <button class="btn plus" onclick="adjust(1,'primary',1)" aria-label="Player 1 primary plus 1">+</button>
        </div>
        <div class="quick-row">
          <button class="quick" onclick="adjust(1,'primary',5)">+5</button>
          <button class="quick" onclick="adjust(1,'primary',10)">+10</button>
          <button class="quick" onclick="adjust(1,'primary',15)">+15</button>
        </div>
      </div>

      <div class="stat">
        <div class="stat-label"><span>Secondary</span><span>max 40</span></div>
        <div class="counter-row">
          <button class="btn minus" onclick="adjust(1,'secondary',-1)" aria-label="Player 1 secondary minus 1">−</button>
          <div class="count" id="p1secondary">0</div>
          <button class="btn plus" onclick="adjust(1,'secondary',1)" aria-label="Player 1 secondary plus 1">+</button>
        </div>
        <div class="quick-row">
          <button class="quick" onclick="adjust(1,'secondary',2)">+2</button>
          <button class="quick" onclick="adjust(1,'secondary',3)">+3</button>
          <button class="quick" onclick="adjust(1,'secondary',5)">+5</button>
        </div>
      </div>

      <div class="stat">
        <div class="stat-label"><span>Command Points</span></div>
        <div class="counter-row">
          <button class="btn minus" onclick="adjust(1,'cp',-1)" aria-label="Player 1 command points minus 1">−</button>
          <div class="count" id="p1cp">0</div>
          <button class="btn plus" onclick="adjust(1,'cp',1)" aria-label="Player 1 command points plus 1">+</button>
        </div>
      </div>
    </section>

    <!-- Player 2 -->
    <section class="player p2">
      <div class="player-name" id="name2" contenteditable="true" spellcheck="false" oninput="syncNames()" title="Tap to rename">Player 2</div>

      <div class="stat">
        <div class="stat-label"><span>Primary</span><span>max 50</span></div>
        <div class="counter-row">
          <button class="btn minus" onclick="adjust(2,'primary',-1)" aria-label="Player 2 primary minus 1">−</button>
          <div class="count" id="p2primary">0</div>
          <button class="btn plus" onclick="adjust(2,'primary',1)" aria-label="Player 2 primary plus 1">+</button>
        </div>
        <div class="quick-row">
          <button class="quick" onclick="adjust(2,'primary',5)">+5</button>
          <button class="quick" onclick="adjust(2,'primary',10)">+10</button>
          <button class="quick" onclick="adjust(2,'primary',15)">+15</button>
        </div>
      </div>

      <div class="stat">
        <div class="stat-label"><span>Secondary</span><span>max 40</span></div>
        <div class="counter-row">
          <button class="btn minus" onclick="adjust(2,'secondary',-1)" aria-label="Player 2 secondary minus 1">−</button>
          <div class="count" id="p2secondary">0</div>
          <button class="btn plus" onclick="adjust(2,'secondary',1)" aria-label="Player 2 secondary plus 1">+</button>
        </div>
        <div class="quick-row">
          <button class="quick" onclick="adjust(2,'secondary',2)">+2</button>
          <button class="quick" onclick="adjust(2,'secondary',3)">+3</button>
          <button class="quick" onclick="adjust(2,'secondary',5)">+5</button>
        </div>
      </div>

      <div class="stat">
        <div class="stat-label"><span>Command Points</span></div>
        <div class="counter-row">
          <button class="btn minus" onclick="adjust(2,'cp',-1)" aria-label="Player 2 command points minus 1">−</button>
          <div class="count" id="p2cp">0</div>
          <button class="btn plus" onclick="adjust(2,'cp',1)" aria-label="Player 2 command points plus 1">+</button>
        </div>
      </div>
    </section>

  </div>

  <button class="reset-btn" id="resetBtn" onclick="showConfirm()">New Battle</button>
  <div class="confirm-row" id="confirmRow">
    <button onclick="hideConfirm()">Cancel</button>
    <button class="confirm-yes" onclick="resetGame()">Reset Everything</button>
  </div>

  <footer>The Emperor Protects</footer>
</div>

<script>
  const CAPS = { primary: 50, secondary: 40, cp: 99 };
  let state = {
    round: 1,
    1: { primary: 0, secondary: 0, cp: 0 },
    2: { primary: 0, secondary: 0, cp: 0 }
  };

  function adjust(player, key, delta) {
    const p = state[player];
    p[key] = Math.min(CAPS[key], Math.max(0, p[key] + delta));
    render();
  }

  function changeRound(delta) {
    state.round = Math.min(6, Math.max(1, state.round + delta));
    render();
  }

  function total(player) {
    return state[player].primary + state[player].secondary;
  }

  function render() {
    for (const p of [1, 2]) {
      document.getElementById('p' + p + 'primary').textContent = state[p].primary;
      document.getElementById('p' + p + 'secondary').textContent = state[p].secondary;
      document.getElementById('p' + p + 'cp').textContent = state[p].cp;
      document.getElementById('vScore' + p).textContent = total(p);
    }

    // Leader highlight
    const t1 = total(1), t2 = total(2);
    document.getElementById('vSide1').classList.toggle('leading', t1 > t2);
    document.getElementById('vSide2').classList.toggle('leading', t2 > t1);

    // Round rail
    const plates = document.querySelectorAll('.round-plate');
    plates.forEach((plate, i) => {
      plate.classList.remove('active', 'done');
      if (i + 1 < state.round) plate.classList.add('done');
      if (i + 1 === state.round && state.round <= 5) plate.classList.add('active');
      if (state.round === 6) plate.classList.add('done');
    });

    const over = state.round === 6;
    document.getElementById('roundText').textContent = over ? 'Battle ended' : `Round ${state.round} of 5`;
    document.getElementById('gameOver').style.display = over ? 'block' : 'none';
    document.getElementById('nextRound').disabled = over;
    document.getElementById('nextRound').textContent = state.round === 5 ? 'End Battle ▸' : 'Next Round ▸';
    document.getElementById('prevRound').disabled = state.round === 1;
  }

  function syncNames() {
    const n1 = document.getElementById('name1').textContent.trim() || 'Player 1';
    const n2 = document.getElementById('name2').textContent.trim() || 'Player 2';
    document.getElementById('vName1').textContent = n1;
    document.getElementById('vName2').textContent = n2;
  }

  function showConfirm() {
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('confirmRow').style.display = 'flex';
  }

  function hideConfirm() {
    document.getElementById('resetBtn').style.display = 'block';
    document.getElementById('confirmRow').style.display = 'none';
  }

  function resetGame() {
    state = {
      round: 1,
      1: { primary: 0, secondary: 0, cp: 0 },
      2: { primary: 0, secondary: 0, cp: 0 }
    };
    hideConfirm();
    render();
  }

  render();
</script>
</body>
</html>
